name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            static_triplet: x64-linux-static
          - os: macos-14
            static_triplet: arm64-osx
          - os: windows-2022
            static_triplet: x64-windows-static
    env:
      VCPKG_DISABLE_METRICS: 1
      VCPKG_FEATURE_FLAGS: manifests,registries
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev ninja-build pcscd

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pcsc-lite pkg-config
          PCSC_PREFIX="$(brew --prefix pcsc-lite)"
          echo "PKG_CONFIG_PATH=$PCSC_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "PCSC_PREFIX=$PCSC_PREFIX" >> "$GITHUB_ENV"

      - name: Start pcscd (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start pcscd || sudo pcscd

      - name: Start PC/SC system service (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/com.apple.pcscd.plist || true
          sudo launchctl enable system/com.apple.pcscd || true
          sudo launchctl kickstart -k system/com.apple.pcscd || true
          if ! sudo launchctl print system/com.apple.pcscd >/dev/null 2>&1; then
            echo "PC/SC system service not available; trying pcscd"
            PCSC_BIN="$PCSC_PREFIX/sbin/pcscd"
            if [ ! -x "$PCSC_BIN" ]; then
              PCSC_BIN="$(command -v pcscd || true)"
            fi
            if [ -n "$PCSC_BIN" ]; then
              sudo "$PCSC_BIN" -f >/tmp/pcscd.log 2>&1 &
              sleep 2
            fi
          fi

      - name: Start PC/SC service (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Service -Name SCardSvr

      - name: Clone vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Clone vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg root (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:USERPROFILE\vcpkg"
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ensure MSVC tools in PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcBin = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64'
          $cl = Join-Path $vcBin 'cl.exe'
          if (-not (Test-Path $cl)) {
            throw "cl.exe not found at $cl"
          }
          $vcBin | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set vcpkg generator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_CMAKE_GENERATOR=NMake Makefiles" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure and build (vcpkg, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            GEN="Unix Makefiles"
            EXTRA_CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$PCSC_PREFIX -DCMAKE_LIBRARY_PATH=$PCSC_PREFIX/lib -DCMAKE_EXE_LINKER_FLAGS=-L$PCSC_PREFIX/lib"
          else
            GEN="Ninja"
            EXTRA_CMAKE_ARGS=""
          fi
          cmake -S . -B build -G "$GEN" $EXTRA_CMAKE_ARGS \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build

      - name: Configure and build (vcpkg, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nmake = (Get-Command nmake.exe -ErrorAction SilentlyContinue).Source
          if (-not $nmake) {
            throw "nmake.exe not found in PATH"
          }
          $env:CC = "cl"
          $env:CXX = "cl"
          cmake -S . -B build -G "NMake Makefiles" `
            -DCMAKE_MAKE_PROGRAM="$nmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build build

      - name: Run binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "macOS" ]; then
            PCSC_REAL_LIB="$PCSC_PREFIX/lib/libpcsclite_real.dylib"
            if [ ! -f "$PCSC_REAL_LIB" ]; then
              PCSC_REAL_LIB="$PCSC_PREFIX/lib/libpcsclite.dylib"
            fi
            if [ -f "$PCSC_REAL_LIB" ]; then
              ln -sf "$PCSC_REAL_LIB" "build/libpcsclite_real.so.1"
              export DYLD_LIBRARY_PATH="$PCSC_PREFIX/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
            else
              echo "pcsc-lite library not found under $PCSC_PREFIX/lib"
            fi
          fi
          LOGFILE="$(mktemp "${RUNNER_TEMP:-/tmp}/globalplatform.XXXXXX.log")"
          export GLOBALPLATFORM_DEBUG=1
          export GLOBALPLATFORM_LOGFILE="$LOGFILE"
          ./build/test_gp
          rc=$?
          if [ -f "$LOGFILE" ]; then
            echo "---- GLOBALPLATFORM_LOGFILE ($LOGFILE) ----"
            cat "$LOGFILE"
            echo "---- end ----"
          else
            echo "GLOBALPLATFORM_LOGFILE not created at $LOGFILE"
          fi
          exit $rc

      - name: Run binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binRoot = Join-Path $PWD 'build\vcpkg_installed\x64-windows\bin'
          $installRoot = Join-Path $PWD 'build\vcpkg_installed\x64-windows'
          if (Test-Path $binRoot) {
            Copy-Item (Join-Path $binRoot '*.dll') -Destination .\build -Force -ErrorAction SilentlyContinue
            $env:PATH = "$binRoot;$env:PATH"
          }
          $plugin = $null
          $globalplatform = $null
          if (Test-Path $installRoot) {
            $globalplatform = Get-ChildItem -Path $installRoot -Recurse -Filter 'globalplatform.dll' |
              Where-Object { $_.FullName -notmatch '\\debug\\' } |
              Select-Object -First 1
            if ($globalplatform) {
              Copy-Item $globalplatform.FullName -Destination .\build -Force -ErrorAction SilentlyContinue
              $env:PATH = "$(Split-Path $globalplatform.FullName -Parent);$env:PATH"
            } else {
              Write-Host "globalplatform.dll not found under $installRoot"
            }
            $plugin = Get-ChildItem -Path $installRoot -Recurse -Filter 'gppcscconnectionplugin.dll' |
              Where-Object { $_.FullName -notmatch '\\debug\\' } |
              Select-Object -First 1
            if ($plugin) {
              Copy-Item $plugin.FullName -Destination .\build -Force -ErrorAction SilentlyContinue
              $pluginDir = Split-Path $plugin.FullName -Parent
              $env:PATH = "$pluginDir;$env:PATH"
            } else {
              Write-Host "gppcscconnectionplugin.dll not found under $installRoot"
            }
          }
          if (-not (Test-Path .\build\test_gp.exe)) {
            Get-ChildItem -Recurse -Filter test_gp.exe
            throw "test_gp.exe not found in build output"
          }
          $buildDir = Join-Path $PWD 'build'
          $env:OPGP_PLUGIN_PATH = $buildDir
          Write-Host "OPGP_PLUGIN_PATH=$env:OPGP_PLUGIN_PATH"
          Write-Host "---- build DLL presence ----"
          Write-Host "gppcscconnectionplugin.dll: $(Test-Path (Join-Path $buildDir 'gppcscconnectionplugin.dll'))"
          Write-Host "globalplatform.dll: $(Test-Path (Join-Path $buildDir 'globalplatform.dll'))"
          Write-Host "libcrypto-3-x64.dll: $(Test-Path (Join-Path $buildDir 'libcrypto-3-x64.dll'))"
          Write-Host "zlib1.dll: $(Test-Path (Join-Path $buildDir 'zlib1.dll'))"
          Write-Host "---- end ----"
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
          if ($dumpbin) {
            Write-Host "---- test_gp.exe dependencies ----"
            & $dumpbin /dependents .\build\test_gp.exe
            Write-Host "---- end ----"
            $globalplatformCopy = Join-Path $PWD 'build\globalplatform.dll'
            if (Test-Path $globalplatformCopy) {
              Write-Host "---- globalplatform.dll dependencies ----"
              & $dumpbin /dependents $globalplatformCopy
              Write-Host "---- end ----"
            } elseif ($globalplatform) {
              Write-Host "---- $($globalplatform.FullName) dependencies ----"
              & $dumpbin /dependents $globalplatform.FullName
              Write-Host "---- end ----"
            }
            if ($plugin) {
              Write-Host "---- $($plugin.FullName) dependencies ----"
              & $dumpbin /dependents $plugin.FullName
              Write-Host "---- end ----"
            }
          } else {
            Write-Host "dumpbin.exe not found"
          }
          $log = Join-Path $env:RUNNER_TEMP ("globalplatform-" + [System.Guid]::NewGuid().ToString() + ".log")
          New-Item -ItemType File -Path $log -Force | Out-Null
          $env:GLOBALPLATFORM_DEBUG = "1"
          $env:GLOBALPLATFORM_LOGFILE = $log
          & .\build\test_gp.exe
          $rc = $LASTEXITCODE
          $rcUnsigned = [uint32]([int64]$rc -band 0xffffffffL)
          $rcHex = "0x{0:X8}" -f $rcUnsigned
          Write-Host "test_gp exit code: $rc ($rcHex)"
          if (Test-Path $log) {
            Write-Host "---- GLOBALPLATFORM_LOGFILE ($log) ----"
            Get-Content -Path $log
            Write-Host "---- end ----"
          } else {
            Write-Host "GLOBALPLATFORM_LOGFILE not created at $log"
          }
          exit $rc

      - name: Configure and build (static, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            GEN="Unix Makefiles"
            EXTRA_CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$PCSC_PREFIX -DCMAKE_LIBRARY_PATH=$PCSC_PREFIX/lib -DCMAKE_EXE_LINKER_FLAGS=-L$PCSC_PREFIX/lib"
          else
            GEN="Ninja"
            EXTRA_CMAKE_ARGS=""
          fi
          cmake -S . -B build-static -G "$GEN" $EXTRA_CMAKE_ARGS \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.static_triplet }}"
          cmake --build build-static

      - name: Configure and build (static, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nmake = (Get-Command nmake.exe -ErrorAction SilentlyContinue).Source
          if (-not $nmake) {
            throw "nmake.exe not found in PATH"
          }
          $env:CC = "cl"
          $env:CXX = "cl"
          cmake -S . -B build-static -G "NMake Makefiles" `
            -DCMAKE_MAKE_PROGRAM="$nmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.static_triplet }}"
          cmake --build build-static

      - name: Run binary (static, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "macOS" ]; then
            PCSC_REAL_LIB="$PCSC_PREFIX/lib/libpcsclite_real.dylib"
            if [ ! -f "$PCSC_REAL_LIB" ]; then
              PCSC_REAL_LIB="$PCSC_PREFIX/lib/libpcsclite.dylib"
            fi
            if [ -f "$PCSC_REAL_LIB" ]; then
              ln -sf "$PCSC_REAL_LIB" "build-static/libpcsclite_real.so.1"
              export DYLD_LIBRARY_PATH="$PCSC_PREFIX/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
            else
              echo "pcsc-lite library not found under $PCSC_PREFIX/lib"
            fi
          fi
          LOGFILE="$(mktemp "${RUNNER_TEMP:-/tmp}/globalplatform.XXXXXX.log")"
          export GLOBALPLATFORM_DEBUG=1
          export GLOBALPLATFORM_LOGFILE="$LOGFILE"
          ./build-static/test_gp
          rc=$?
          if [ -f "$LOGFILE" ]; then
            echo "---- GLOBALPLATFORM_LOGFILE ($LOGFILE) ----"
            cat "$LOGFILE"
            echo "---- end ----"
          else
            echo "GLOBALPLATFORM_LOGFILE not created at $LOGFILE"
          fi
          exit $rc

      - name: Run binary (static, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binRoot = Join-Path $PWD 'build-static\vcpkg_installed\x64-windows-static\bin'
          $installRoot = Join-Path $PWD 'build-static\vcpkg_installed\x64-windows-static'
          if (Test-Path $binRoot) {
            Copy-Item (Join-Path $binRoot '*.dll') -Destination .\build-static -Force -ErrorAction SilentlyContinue
            $env:PATH = "$binRoot;$env:PATH"
          }
          $plugin = $null
          $globalplatform = $null
          if (Test-Path $installRoot) {
            $globalplatform = Get-ChildItem -Path $installRoot -Recurse -Filter 'globalplatform.dll' |
              Where-Object { $_.FullName -notmatch '\\debug\\' } |
              Select-Object -First 1
            if ($globalplatform) {
              Copy-Item $globalplatform.FullName -Destination .\build-static -Force -ErrorAction SilentlyContinue
              $env:PATH = "$(Split-Path $globalplatform.FullName -Parent);$env:PATH"
            } else {
              Write-Host "globalplatform.dll not found under $installRoot"
            }
            $plugin = Get-ChildItem -Path $installRoot -Recurse -Filter 'gppcscconnectionplugin.dll' |
              Where-Object { $_.FullName -notmatch '\\debug\\' } |
              Select-Object -First 1
            if ($plugin) {
              Copy-Item $plugin.FullName -Destination .\build-static -Force -ErrorAction SilentlyContinue
              $pluginDir = Split-Path $plugin.FullName -Parent
              $env:PATH = "$pluginDir;$env:PATH"
            } else {
              Write-Host "gppcscconnectionplugin.dll not found under $installRoot"
            }
          }
          if (-not (Test-Path .\build-static\test_gp.exe)) {
            Get-ChildItem -Recurse -Filter test_gp.exe
            throw "test_gp.exe not found in build-static output"
          }
          $buildDir = Join-Path $PWD 'build-static'
          $env:OPGP_PLUGIN_PATH = $buildDir
          Write-Host "OPGP_PLUGIN_PATH=$env:OPGP_PLUGIN_PATH"
          Write-Host "---- build-static DLL presence ----"
          Write-Host "gppcscconnectionplugin.dll: $(Test-Path (Join-Path $buildDir 'gppcscconnectionplugin.dll'))"
          Write-Host "globalplatform.dll: $(Test-Path (Join-Path $buildDir 'globalplatform.dll'))"
          Write-Host "libcrypto-3-x64.dll: $(Test-Path (Join-Path $buildDir 'libcrypto-3-x64.dll'))"
          Write-Host "zlib1.dll: $(Test-Path (Join-Path $buildDir 'zlib1.dll'))"
          Write-Host "---- end ----"
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction SilentlyContinue).Source
          if ($dumpbin) {
            Write-Host "---- test_gp.exe dependencies (static) ----"
            & $dumpbin /dependents .\build-static\test_gp.exe
            Write-Host "---- end ----"
            $globalplatformCopy = Join-Path $PWD 'build-static\globalplatform.dll'
            if (Test-Path $globalplatformCopy) {
              Write-Host "---- globalplatform.dll dependencies (static) ----"
              & $dumpbin /dependents $globalplatformCopy
              Write-Host "---- end ----"
            } elseif ($globalplatform) {
              Write-Host "---- $($globalplatform.FullName) dependencies ----"
              & $dumpbin /dependents $globalplatform.FullName
              Write-Host "---- end ----"
            }
            if ($plugin) {
              Write-Host "---- $($plugin.FullName) dependencies ----"
              & $dumpbin /dependents $plugin.FullName
              Write-Host "---- end ----"
            }
          } else {
            Write-Host "dumpbin.exe not found"
          }
          $log = Join-Path $env:RUNNER_TEMP ("globalplatform-" + [System.Guid]::NewGuid().ToString() + ".log")
          New-Item -ItemType File -Path $log -Force | Out-Null
          $env:GLOBALPLATFORM_DEBUG = "1"
          $env:GLOBALPLATFORM_LOGFILE = $log
          & .\build-static\test_gp.exe
          $rc = $LASTEXITCODE
          $rcUnsigned = [uint32]([int64]$rc -band 0xffffffffL)
          $rcHex = "0x{0:X8}" -f $rcUnsigned
          Write-Host "test_gp exit code: $rc ($rcHex)"
          if (Test-Path $log) {
            Write-Host "---- GLOBALPLATFORM_LOGFILE ($log) ----"
            Get-Content -Path $log
            Write-Host "---- end ----"
          } else {
            Write-Host "GLOBALPLATFORM_LOGFILE not created at $log"
          }
          exit $rc
