name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            static_triplet: x64-linux-static
          - os: macos-14
            static_triplet: arm64-osx
          - os: windows-2022
            static_triplet: x64-windows-static
    env:
      VCPKG_DISABLE_METRICS: 1
      VCPKG_FEATURE_FLAGS: manifests,registries
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev ninja-build pcscd

      - name: Start pcscd (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemctl start pcscd || sudo pcscd

      - name: Start PC/SC service (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo launchctl kickstart -k system/com.apple.pcscd \
            || sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.pcscd.plist \
            || { PCSC_BIN="$(command -v pcscd || true)"; [ -n "$PCSC_BIN" ] && sudo "$PCSC_BIN"; }

      - name: Start PC/SC service (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Service -Name SCardSvr

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pcsc-lite pkg-config
          PCSC_PREFIX="$(brew --prefix pcsc-lite)"
          echo "PKG_CONFIG_PATH=$PCSC_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "PCSC_PREFIX=$PCSC_PREFIX" >> "$GITHUB_ENV"

      - name: Clone vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Clone vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:USERPROFILE\vcpkg"
          & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build (vcpkg, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            GEN="Unix Makefiles"
            EXTRA_CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$PCSC_PREFIX -DCMAKE_LIBRARY_PATH=$PCSC_PREFIX/lib"
          else
            GEN="Ninja"
            EXTRA_CMAKE_ARGS=""
          fi
          cmake -S . -B build -G "$GEN" $EXTRA_CMAKE_ARGS \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build

      - name: Configure and build (vcpkg, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nmake = "$env:VCToolsInstallDir\bin\Hostx64\x64\nmake.exe"
          if (-not (Test-Path $nmake)) {
            throw "nmake.exe not found at $nmake"
          }
          cmake -S . -B build -G "NMake Makefiles" `
            -DCMAKE_MAKE_PROGRAM="$nmake" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build build

      - name: Run binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          LOGFILE="$(mktemp "${RUNNER_TEMP:-/tmp}/globalplatform.XXXXXX.log")"
          export GLOBALPLATFORM_DEBUG=1
          export GLOBALPLATFORM_LOGFILE="$LOGFILE"
          ./build/test_gp
          rc=$?
          if [ -f "$LOGFILE" ]; then
            echo "---- GLOBALPLATFORM_LOGFILE ($LOGFILE) ----"
            cat "$LOGFILE"
            echo "---- end ----"
          else
            echo "GLOBALPLATFORM_LOGFILE not created at $LOGFILE"
          fi
          exit $rc

      - name: Run binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP ("globalplatform-" + [System.Guid]::NewGuid().ToString() + ".log")
          New-Item -ItemType File -Path $log -Force | Out-Null
          $env:GLOBALPLATFORM_DEBUG = "1"
          $env:GLOBALPLATFORM_LOGFILE = $log
          & .\build\test_gp.exe
          $rc = $LASTEXITCODE
          if (Test-Path $log) {
            Write-Host "---- GLOBALPLATFORM_LOGFILE ($log) ----"
            Get-Content -Path $log
            Write-Host "---- end ----"
          } else {
            Write-Host "GLOBALPLATFORM_LOGFILE not created at $log"
          }
          exit $rc

      - name: Configure and build (static, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            GEN="Unix Makefiles"
            EXTRA_CMAKE_ARGS="-DCMAKE_PREFIX_PATH=$PCSC_PREFIX -DCMAKE_LIBRARY_PATH=$PCSC_PREFIX/lib"
          else
            GEN="Ninja"
            EXTRA_CMAKE_ARGS=""
          fi
          cmake -S . -B build-static -G "$GEN" $EXTRA_CMAKE_ARGS \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.static_triplet }}"
          cmake --build build-static

      - name: Configure and build (static, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nmake = "$env:VCToolsInstallDir\bin\Hostx64\x64\nmake.exe"
          if (-not (Test-Path $nmake)) {
            throw "nmake.exe not found at $nmake"
          }
          cmake -S . -B build-static -G "NMake Makefiles" `
            -DCMAKE_MAKE_PROGRAM="$nmake" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.static_triplet }}"
          cmake --build build-static

      - name: Run binary (static, Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          LOGFILE="$(mktemp "${RUNNER_TEMP:-/tmp}/globalplatform.XXXXXX.log")"
          export GLOBALPLATFORM_DEBUG=1
          export GLOBALPLATFORM_LOGFILE="$LOGFILE"
          ./build-static/test_gp
          rc=$?
          if [ -f "$LOGFILE" ]; then
            echo "---- GLOBALPLATFORM_LOGFILE ($LOGFILE) ----"
            cat "$LOGFILE"
            echo "---- end ----"
          else
            echo "GLOBALPLATFORM_LOGFILE not created at $LOGFILE"
          fi
          exit $rc

      - name: Run binary (static, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP ("globalplatform-" + [System.Guid]::NewGuid().ToString() + ".log")
          New-Item -ItemType File -Path $log -Force | Out-Null
          $env:GLOBALPLATFORM_DEBUG = "1"
          $env:GLOBALPLATFORM_LOGFILE = $log
          & .\build-static\test_gp.exe
          $rc = $LASTEXITCODE
          if (Test-Path $log) {
            Write-Host "---- GLOBALPLATFORM_LOGFILE ($log) ----"
            Get-Content -Path $log
            Write-Host "---- end ----"
          } else {
            Write-Host "GLOBALPLATFORM_LOGFILE not created at $log"
          }
          exit $rc
